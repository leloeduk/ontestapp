name: Build APK & AAB

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          cache: true

      - run: flutter pub get

      - run: flutter doctor -v

      # Debug APK (toujours)
      - run: flutter build apk --debug --target-platform android-arm64
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: build/app/outputs/flutter-apk/*.apk

      # Vérifier si le keystore est configuré
      - id: check_ks
        name: Check keystore
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      # Release builds (seulement si keystore dispo)
      - if: steps.check_ks.outputs.ready == 'true'
        name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks

      - if: steps.check_ks.outputs.ready == 'true'
        name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEYSTORE_KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - if: steps.check_ks.outputs.ready == 'true'
        name: Build release AAB
        run: flutter build appbundle --release --split-debug-info=build/debug-info --obfuscate

      - if: steps.check_ks.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aab-release
          path: build/app/outputs/bundle/release/*.aab

      - if: steps.check_ks.outputs.ready == 'true'
        name: Build release APK
        run: flutter build apk --release --target-platform android-arm64 --split-debug-info=build/debug-info --obfuscate

      - if: steps.check_ks.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: build/app/outputs/flutter-apk/*.apk
