name: Build APK & AAB

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          cache: true

      - run: flutter pub get

      # Debug APK
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: build/app/outputs/flutter-apk/*.apk

      # Release builds (signé via secrets GitHub)
      - name: Decode keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks

      - name: Create key.properties
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEYSTORE_KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - run: flutter build appbundle --release
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}

      - uses: actions/upload-artifact@v4
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        with:
          name: aab-release
          path: build/app/outputs/bundle/release/*.aab

      - run: flutter build apk --release
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}

      - uses: actions/upload-artifact@v4
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        with:
          name: apk-release
          path: build/app/outputs/flutter-apk/*.apk
